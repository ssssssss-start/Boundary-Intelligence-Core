<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>防骗训练营</title>
  <style>
    :root { --bg:#eef2f5; --panel:#fff; --soft:#f7f9fb; --line:#d8e0e7; --text:#182230; --muted:#637083; --primary:#116d7a; --success:#2f7d4a; --warning:#a86511; --header:#17212b; --radius:8px; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif; letter-spacing:0; }
    button { font:inherit; }
    .app { min-height:100vh; display:grid; grid-template-rows:50px minmax(0,1fr); }
    .topbar { background:var(--header); color:#fff; display:flex; align-items:center; gap:12px; padding:0 14px; border-bottom:1px solid #0e151d; }
    .mark { width:28px; height:28px; border-radius:7px; display:grid; place-items:center; background:#e4aa31; color:#17212b; font-weight:800; flex:0 0 auto; }
    .brand { line-height:1.15; min-width:0; }
    .brand strong { display:block; font-size:15px; white-space:nowrap; }
    .brand span { display:block; font-size:11px; color:#b9c5d1; white-space:nowrap; }
    .nav { display:flex; align-items:center; gap:8px; margin-left:10px; overflow-x:auto; }
    .nav a, .profile-link { min-height:30px; border:1px solid rgba(255,255,255,.22); border-radius:7px; padding:0 10px; color:#d9e4ef; text-decoration:none; display:inline-flex; align-items:center; white-space:nowrap; font-size:12px; }
    .nav a.active { background:var(--primary); border-color:var(--primary); color:#fff; }
    .nav a.emergency { border-color:rgba(255,182,186,.48); color:#ffd8dc; }
    .top-spacer { flex:1; }
    .profile-link { width:34px; justify-content:center; border-radius:50%; padding:0; font-weight:700; }
    .main { min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:10px; padding:10px; }
    .panel { min-width:0; min-height:0; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
    .panel-head { min-height:44px; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:0 12px; background:var(--soft); border-bottom:1px solid var(--line); }
    .panel-head strong { font-size:14px; }
    .panel-head span { color:var(--muted); font-size:12px; }
    .game { display:grid; grid-template-rows:44px minmax(0,1fr); }
    .game-body { overflow:auto; padding:14px; }
    .level-title { font-size:20px; line-height:1.35; margin:0 0 8px; }
    .scenario { border:1px solid var(--line); border-radius:8px; padding:12px; line-height:1.65; background:#fff; margin-bottom:12px; white-space:pre-wrap; }
    .options { display:grid; gap:8px; }
    .option-btn { min-height:42px; border:1px solid var(--line); border-radius:7px; background:#fff; cursor:pointer; text-align:left; padding:8px 10px; color:var(--text); }
    .option-btn:hover { border-color:var(--primary); }
    .option-btn.selected { background:#e7f4f6; border-color:var(--primary); color:#0d5964; font-weight:700; }
    .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
    .primary-btn, .ghost-btn { min-height:36px; border-radius:7px; cursor:pointer; padding:0 12px; }
    .primary-btn { border:1px solid var(--primary); background:var(--primary); color:#fff; }
    .ghost-btn { border:1px solid var(--line); background:#fff; color:var(--text); }
    .side { display:grid; grid-template-rows:44px minmax(0,1fr); }
    .side-body { overflow:auto; padding:12px; }
    .metric { border:1px solid var(--line); border-radius:7px; padding:10px; margin-bottom:8px; background:#fff; }
    .metric span { display:block; color:var(--muted); font-size:12px; margin-bottom:5px; }
    .metric strong { display:block; font-size:18px; line-height:1.25; }
    .feedback { border:1px solid var(--line); border-radius:8px; padding:10px; background:#fff; line-height:1.6; margin-top:12px; white-space:pre-wrap; }
    .badge { display:inline-flex; align-items:center; min-height:26px; border-radius:999px; background:#e8f6ed; color:var(--success); padding:0 9px; margin:0 5px 5px 0; font-size:12px; }
    @media (max-width:900px) { .main { grid-template-columns:1fr; } .brand span { display:none; } }
  
    /* 柔色扁平主题覆盖 */
    :root {
      --bg: #f6f4ef;
      --panel: #fffdf9;
      --panel-2: #fbf7ef;
      --panel-3: #f8f2e9;
      --soft: #fbf7ef;
      --line: #e3ded5;
      --line-soft: #e9e3d8;
      --text: #263238;
      --muted: #6c7875;
      --primary: #4b9a96;
      --primary-hover: #3f8581;
      --cyan: #6faeaa;
      --success: #4d8b63;
      --warning: #b4863f;
      --danger: #c55a62;
      --header: #fbf7ef;
      --radius: 8px;
    }

    body {
      background: var(--bg) !important;
      color: var(--text) !important;
    }

    .topbar,
    .sidebar,
    .side-foot,
    .panel-head,
    .toolbar,
    .main-head,
    .header,
    .card-head {
      background: #fbf7ef !important;
      color: var(--text) !important;
      border-color: var(--line) !important;
      box-shadow: none !important;
    }

    .shell,
    .app,
    .main,
    .login-view,
    .content,
    .messages {
      background: var(--bg) !important;
    }

    .panel,
    .card,
    .login-box,
    .step,
    .metric,
    .feedback,
    .scenario,
    .warn-box,
    .actions .item,
    .table-wrap,
    .upload-card,
    .form-card,
    .result-card,
    .side-card,
    .stat-card,
    .review-card,
    .profile-card,
    .bubble {
      background: var(--panel) !important;
      color: var(--text) !important;
      border: 1px solid var(--line) !important;
      border-radius: 8px !important;
      box-shadow: none !important;
    }

    input,
    textarea,
    select {
      background: #fffdf9 !important;
      color: var(--text) !important;
      border: 1px solid var(--line) !important;
      border-radius: 8px !important;
      box-shadow: none !important;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #8cc8c2 !important;
      outline: 2px solid rgba(75, 154, 150, 0.14) !important;
      outline-offset: 0;
    }

    button,
    .nav a,
    .profile-link,
    .ghost-btn,
    .option-btn,
    .secondary-btn,
    .link-btn {
      border-radius: 8px !important;
      box-shadow: none !important;
    }

    .primary-btn,
    .send-btn,
    .nav a.active,
    .submit-btn,
    .login-btn,
    .import-btn,
    .save-btn,
    .option-btn.selected {
      background: var(--primary) !important;
      border-color: var(--primary) !important;
      color: #fff !important;
      box-shadow: none !important;
    }

    .primary-btn:hover,
    .send-btn:hover,
    .submit-btn:hover,
    .login-btn:hover,
    .import-btn:hover,
    .save-btn:hover {
      background: var(--primary-hover) !important;
      border-color: var(--primary-hover) !important;
    }

    .ghost-btn,
    .option-btn,
    .secondary-btn,
    .quick button,
    .nav a,
    .profile-link,
    .link-btn {
      background: #fffdf9 !important;
      color: var(--text) !important;
      border-color: var(--line) !important;
    }

    .ghost-btn:hover,
    .option-btn:hover,
    .quick button:hover,
    .nav a:hover,
    .profile-link:hover,
    .link-btn:hover {
      background: #e7f3f0 !important;
      color: #1d5f5b !important;
      border-color: #bcdcd7 !important;
    }

    .mark,
    .avatar,
    .badge {
      background: #e7f3f0 !important;
      color: #1d5f5b !important;
      border-color: #bcdcd7 !important;
    }

    .avatar.bot,
    .warn-box,
    .nav a.emergency,
    .msg.user .bubble {
      background: #fff0e9 !important;
      color: #8b3b42 !important;
      border-color: #f0c9bd !important;
    }

    .msg.user .bubble,
    .send-btn.danger,
    .nav a.active.emergency {
      background: var(--danger) !important;
      border-color: var(--danger) !important;
      color: #fff !important;
    }

    label,
    .muted,
    .meta,
    .brand span,
    .panel-head span,
    .metric span,
    .step span {
      color: var(--muted) !important;
    }

    table,
    th,
    td {
      border-color: var(--line) !important;
    }

    th {
      background: #fbf7ef !important;
      color: var(--text) !important;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="mark">盾</div>
      <div class="brand"><strong>防骗训练营</strong><span>情景模拟 + 积分勋章</span></div>
      <nav class="nav">
        <a href="/chat.html">智能反诈助手</a>
        <a class="emergency" href="/emergency.html">紧急风险劝阻</a>
        <a class="active" href="/training.html">防骗训练营</a>
      </nav>
      <div class="top-spacer"></div>
      <a class="profile-link" href="/profile.html" title="个人中心">我</a>
    </header>

    <main class="main">
      <section class="panel game">
        <div class="panel-head"><strong>情景闯关</strong><span id="levelMeta">加载中</span></div>
        <div class="game-body">
          <h1 class="level-title" id="levelTitle">加载关卡中</h1>
          <div class="scenario" id="scenario">请稍候。</div>
          <div class="options" id="options"></div>
          <div class="actions">
            <button class="ghost-btn" type="button" id="nextBtn">下一题</button>
            <button class="primary-btn" type="button" id="submitBtn">提交答案</button>
          </div>
          <div class="feedback" id="feedback">完成情景题可以获得积分和勋章。</div>
        </div>
      </section>

      <aside class="panel side">
        <div class="panel-head"><strong>成长记录</strong><span id="sourceLabel">-</span></div>
        <div class="side-body">
          <div class="metric"><span>积分</span><strong id="score">0</strong></div>
          <div class="metric"><span>答题数</span><strong id="answered">0</strong></div>
          <div class="metric"><span>正确率</span><strong id="accuracy">0%</strong></div>
          <div class="metric"><span>测评等级</span><strong id="assessment">未测评</strong></div>
          <div id="badges"></div>
        </div>
      </aside>
    </main>
  </div>

  <script>
    const userId = localStorage.getItem("antiFraudUserId") || "demo_user";
    localStorage.setItem("antiFraudUserId", userId);
    const $ = (id) => document.getElementById(id);
    let currentLevel = null;
    let selectedAnswer = "";

    function renderReport(report) {
      $("score").textContent = report.score ?? 0;
      $("answered").textContent = `${report.answered_count || 0}/${report.total_levels || 0}`;
      $("accuracy").textContent = `${Math.round(Number(report.accuracy || 0) * 100)}%`;
      $("assessment").textContent = report.assessment_level || "未测评";
      const badges = $("badges");
      badges.innerHTML = "";
      (report.badges || []).forEach((item) => {
        const span = document.createElement("span");
        span.className = "badge";
        span.textContent = item;
        badges.appendChild(span);
      });
    }

    async function loadReport() {
      try {
        const resp = await fetch(`/game/report?user_id=${encodeURIComponent(userId)}`);
        const data = await resp.json();
        if (resp.ok) renderReport(data);
      } catch {}
    }

    function renderLevel(data) {
      currentLevel = data.level || {};
      selectedAnswer = "";
      $("sourceLabel").textContent = data.source || "-";
      $("levelMeta").textContent = `第 ${currentLevel.level_id || "-"} 关 / 共 ${data.total || "-"} 关`;
      $("levelTitle").textContent = currentLevel.title || "情景判断";
      $("scenario").textContent = currentLevel.scenario || currentLevel.question || "请判断这个场景是否有风险。";
      const options = $("options");
      options.innerHTML = "";
      (currentLevel.options || []).forEach((item, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.type = "button";
        btn.textContent = `${index + 1}. ${item}`;
        btn.onclick = () => {
          selectedAnswer = item;
          document.querySelectorAll(".option-btn").forEach((node) => node.classList.remove("selected"));
          btn.classList.add("selected");
        };
        options.appendChild(btn);
      });
      $("feedback").textContent = "选择一个答案后提交。";
    }

    async function loadNext(levelId) {
      const url = levelId ? `/game/next?user_id=${encodeURIComponent(userId)}&level_id=${levelId}` : `/game/next?user_id=${encodeURIComponent(userId)}`;
      const resp = await fetch(url);
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);
      renderLevel(data);
      await loadReport();
    }

    async function submitAnswer() {
      if (!currentLevel || !currentLevel.level_id || !selectedAnswer) {
        $("feedback").textContent = "请先选择一个答案。";
        return;
      }
      const resp = await fetch("/game/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: userId, level_id: currentLevel.level_id, answer: selectedAnswer })
      });
      const data = await resp.json();
      if (!resp.ok) {
        $("feedback").textContent = data.detail || "提交失败";
        return;
      }
      $("feedback").textContent = `${data.correct ? "回答正确" : "回答错误"}\n正确答案：${data.answer}\n${data.explanation || ""}${data.badge ? "\n获得勋章：" + data.badge : ""}`;
      await loadReport();
    }

    $("submitBtn").addEventListener("click", submitAnswer);
    $("nextBtn").addEventListener("click", () => loadNext());
    loadNext().catch((error) => {
      $("levelTitle").textContent = "加载失败";
      $("scenario").textContent = error.message;
    });
  </script>
</body>
</html>
